name: Sync Profile README

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'scripts/sync-profile.mjs'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Profile README Sync
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: 'jericbas/jericbas'
        run: node scripts/sync-profile.mjs
